data:
  dataset:
    name: crafter_play144_train
    val_name: crafter_play144_val
    keys_to_load:
    - pixels
    - action
    keys_to_cache:
    - action
    total_transitions: null
    val_total_transitions: null
    level1:
      frameskip: 5
      num_steps: ${eval:'${level1.wm.history_size} + ${level1.wm.rollout_n}'}
    level2:
      frameskip: ${level2.stride}
      window_size: ${level2.window_size}
      num_steps: ${eval:'${level2.wm.history_size} + ${level2.wm.rollout_n}'}
    level3:
      frameskip: ${level3.stride}
      window_size: ${level3.window_size}
      num_steps: ${eval:'${level3.wm.history_size} + ${level3.wm.rollout_n}'}
quick_debug: false
output_model_name: crafter_ft_hjepa_l3
env: crafter
subdir: ${env}/${output_model_name}/seed${seed}
num_workers: 4
seed: 42
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: true
save_every_n_epochs: 1
resume_every_n_steps: 2000
trainer:
  max_epochs: 2
  devices: 1
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0
  num_sanity_val_steps: 1
  limit_train_batches: 8000
  limit_val_batches: 40
loader:
  batch_size: 24
  num_workers: ${num_workers}
  drop_last: true
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
  shuffle: true
optimizer:
  type: AdamW
  lr: 5.0e-05
  weight_decay: 0.001
  warmup_ratio: 0.05
wandb:
  enabled: false
  config:
    entity: null
    project: hjepa
    name: null
    id: null
    resume: allow
    log_model: false
planning_eval:
  enabled: false
  config_name: fourroom_l3
  output_subdir: planning_eval
  run_on_train_end: false
  every_n_epochs: 0
final_probing_decoding_eval:
  enabled: false
  config_name: fourroom
  output_subdir: final_probing_decoding_eval
  overrides:
    level1:
      train_decoder: true
      probes:
        enabled: true
    level2:
      train_decoder: true
      probes:
        enabled: true
    level3:
      train_decoder: true
      probes:
        enabled: true
level1:
  lr: 2.0e-05
  wm:
    history_size: 3
    rollout_n: 1
    rollout_loss_weight: 1.0
    embed_dim: 192
    use_proprio: false
    action_dim: 14
  encoder:
    type: vit
    scale: ${encoder_scale}
    projector:
      type: mlp
  predictor:
    depth: 4
    heads: 8
    mlp_dim: 1024
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
    hidden_dim: 192
    projector:
      type: mlp
  loss:
    embed:
      sigreg:
        enabled: true
        weight: 0.18
num_levels: 3
level2:
  lr: 5.0e-06
  stride: 2
  window_size: 1
  wm:
    history_size: 3
    rollout_n: 1
    rollout_loss_weight: 1.0
    embed_dim: 192
    use_proprio: false
  encoder:
    type: latent_mlp
    input_dim: ${level1.wm.embed_dim}
    hidden_dim: 384
    final_ln: false
    output_dim: ${level2.wm.embed_dim}
    projector:
      type: identity
  action_encoder:
    output_dim: 4
    input_dim: ${level1.wm.embed_dim}
    max_chunk: ${eval:'${data.dataset.level2.frameskip} + 1'}
    queue_size: 4000
  action_embed:
    patch_embed: false
    input_dim: ${level2.action_encoder.output_dim}
  predictor:
    depth: 4
    heads: 8
    mlp_dim: 1024
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
    hidden_dim: 192
    projector:
      type: mlp
  loss:
    embed:
      sigreg:
        enabled: true
        weight: 0.18
level3:
  lr: 5.0e-06
  stride: 2
  window_size: 1
  wm:
    history_size: 3
    rollout_n: 1
    rollout_loss_weight: 1.0
    embed_dim: 192
    use_proprio: false
  encoder:
    type: latent_mlp
    input_dim: ${level2.wm.embed_dim}
    hidden_dim: 384
    final_ln: false
    output_dim: ${level3.wm.embed_dim}
    projector:
      type: identity
  action_encoder:
    output_dim: 4
    input_dim: ${level2.wm.embed_dim}
    max_chunk: ${eval:'${data.dataset.level3.frameskip} + 1'}
    queue_size: 4000
  action_embed:
    patch_embed: false
    input_dim: ${level3.action_encoder.output_dim}
  predictor:
    depth: 4
    heads: 8
    mlp_dim: 1024
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
    hidden_dim: 192
    projector:
      type: mlp
  loss:
    embed:
      sigreg:
        enabled: true
        weight: 0.18
init_from:
  ckpt: ${oc.env:HJEPA_HOME}/ckpts/fourroom/fourroom_hjepa_l3/seed42/fourroom_hjepa_l3_object.ckpt
  old_action_dim: 2
resize_pixels_on_device: true
