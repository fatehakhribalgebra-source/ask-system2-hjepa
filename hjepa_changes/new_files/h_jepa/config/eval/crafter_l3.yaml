# Crafter (FourRoom-initialised H-JEPA fine-tuned on CrafterPlay): 3-level planning, same planner as fourroom_l3.
# Used by ask/experiments/crafter_explore.py (not eval.py). Inputs: 224px frames (144px upscaled, nearest).
cache_dir: ${oc.env:HJEPA_HOME}
dataset:
  keys_to_cache:
  - action
  level1:
    frameskip: 5
    num_steps: 1
seed: 42
policy: null
solver:
  _target_: hierarchical_solver.HierarchicalSolver
  solvers:
    level1:
      _target_: stable_worldmodel.solver.GradientSolver
      n_steps: 40
      batch_size: 1
      var_scale: 1.0
      num_samples: 50
      action_noise: 0
      device: cuda
      seed: ${seed}
      optimizer_cls:
        _target_: hydra.utils.get_class
        path: torch.optim.AdamW
      optimizer_kwargs:
        lr: 0.08
    level2:
      _target_: stable_worldmodel.solver.GradientSolver
      n_steps: 40
      batch_size: 1
      var_scale: 1.0
      num_samples: 100
      action_noise: 0
      device: cuda
      seed: ${seed}
      optimizer_cls:
        _target_: hydra.utils.get_class
        path: torch.optim.AdamW
      optimizer_kwargs:
        lr: 0.1
    level3:
      _target_: stable_worldmodel.solver.GradientSolver
      n_steps: 40
      batch_size: 1
      var_scale: 1.0
      num_samples: 100
      action_noise: 0
      device: cuda
      seed: ${seed}
      optimizer_cls:
        _target_: hydra.utils.get_class
        path: torch.optim.AdamW
      optimizer_kwargs:
        lr: 0.1
hierarchical_plan_config:
  receding_horizon: 2
  level1:
    horizon: 2
    pre_decay_horizon: 2
    action_block: 5
    cost_last_n: 2
    action_cost_weight: 0.0
  level2:
    horizon: 2
    pre_decay_horizon: 2
    action_block: 1
    action_dim: 4
    num_subgoals: 1
    cost_last_n: 1
    horizon_one_goal_cost_space: upper
  level3:
    horizon: 3
    action_block: 1
    action_dim: 4
    num_subgoals: 1
    cost_last_n: 1
    horizon_one_goal_cost_space: upper
eval:
  eval_budget: 60
  img_size: 224
output:
  dir: null
