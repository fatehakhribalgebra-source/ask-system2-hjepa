# @package _global_
# Crafter (Craftax-Classic pixels, CrafterPlay expert data). Discrete actions embedded as 14-d vectors.
data:
  dataset:
    name: crafter_play_train
    val_name: crafter_play_val
    keys_to_load:
    - pixels
    - action
    keys_to_cache:
    - action
    level1:
      frameskip: 2
      num_steps: ${eval:'${level1.wm.history_size} + ${level1.wm.rollout_n}'}
quick_debug: false
output_model_name: model
env: crafter
subdir: ${env}/${output_model_name}/seed${seed}
hydra:
  run:
    dir: ${oc.env:HJEPA_HOME,${oc.env:HOME}/.stable_worldmodel}/ckpts/${subdir}/hydra
num_workers: 4
seed: 42
img_size: 64
patch_size: 4
encoder_scale: tiny
dump_object: true
save_every_n_epochs: 1
resume_every_n_steps: 2000
trainer:
  max_epochs: 3
  limit_train_batches: 12000
  limit_val_batches: 50
  devices: 1
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0
  num_sanity_val_steps: 1
loader:
  batch_size: 32
  num_workers: ${num_workers}
  drop_last: true
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
  shuffle: true
optimizer:
  type: AdamW
  lr: 5.0e-05
  weight_decay: 0.001
wandb:
  enabled: false
  config:
    entity: null
    project: hjepa
    name: null
    id: null
    resume: allow
    log_model: false
planning_eval:
  enabled: false
  config_name: none
  output_subdir: planning_eval
  run_on_train_end: false
  every_n_epochs: 0
final_probing_decoding_eval:
  enabled: false
  config_name: none
  output_subdir: final_probing_decoding_eval
  overrides: {}
level1:
  lr: 5.0e-05
  wm:
    history_size: 3
    rollout_n: 1
    rollout_loss_weight: 1.0
    embed_dim: 192
    use_proprio: false
    action_dim: 14
  encoder:
    type: vit
    scale: ${encoder_scale}
    projector:
      type: mlp
  predictor:
    depth: 4
    heads: 8
    mlp_dim: 1024
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
    hidden_dim: 192
    projector:
      type: mlp
  loss:
    embed:
      sigreg:
        enabled: true
        weight: 0.09
